name: Build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: devbuds-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devbuds_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devbuds_ci
      JWT_SECRET: ci-only-session-secret-at-least-32-characters
      DEMO_MODE: 'true'
      DEMO_OTP: '123456'
      TRANSCRIBER: mock
      EXTRACTOR: mock
      CRON_SECRET: ci-only-scheduler-secret-at-least-32-characters
      VERIFY_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run deploy:check
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:monitor
      - name: Start production server
        run: |
          npm run start -- --port 3001 > /tmp/devbuds-ci.log 2>&1 &
          node --input-type=module <<'JS'
          let ready = false;
          for (let i = 0; i < 60; i++) {
            try {
              const response = await fetch('http://localhost:3001/api/health');
              if (response.ok) { ready = true; break; }
            } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          if (!ready) throw new Error('Production server did not become ready.');
          JS
      - run: npm run test:integration
      - run: npm run test:automations
      - name: Server diagnostics on failure
        if: failure()
        run: |
          if [ -f /tmp/devbuds-ci.log ]; then cat /tmp/devbuds-ci.log; fi
