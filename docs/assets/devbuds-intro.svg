<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">DevBuds — Ten-Minute Mentor</title>
  <desc id="description">A faculty mentoring workspace. Notice attendance, marks, and LMS signals. Talk using Tamil or English voice notes. Follow through with reminders, progress timelines, and meeting preparation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102c25"/>
      <stop offset="1" stop-color="#193d30"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#234c3d"/>
      <stop offset="1" stop-color="#1b3f32"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#bad7b9" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .small { font-size: 12px; font-weight: 600; letter-spacing: 2px; }
    .step { animation: step 12s linear infinite; opacity: 0; }
    .first { opacity: 1; }
    .second { animation-delay: -8s; }
    .third { animation-delay: -4s; }
    .flow { animation: flow 12s cubic-bezier(.77,0,.175,1) infinite; }
    .enter { animation: enter 800ms cubic-bezier(.23,1,.32,1) both; }
    .delay-one { animation-delay: 80ms; }
    .delay-two { animation-delay: 160ms; }
    .delay-three { animation-delay: 240ms; }
    .delay-four { animation-delay: 320ms; }
    .halo { transform-box: fill-box; transform-origin: center; animation: ripple 2s cubic-bezier(.23,1,.32,1) infinite; }
    .wave { transform-box: fill-box; transform-origin: center; animation: voice 1200ms cubic-bezier(.77,0,.175,1) infinite; }
    .wave-b { animation-delay: -200ms; }
    .wave-c { animation-delay: -400ms; }
    .wave-d { animation-delay: -600ms; }
    .signal { transform-box: fill-box; transform-origin: bottom; animation: signal 3s cubic-bezier(.77,0,.175,1) infinite; }
    .signal-b { animation-delay: -800ms; }
    .signal-c { animation-delay: -1600ms; }
    .check { transform-box: fill-box; transform-origin: center; animation: confirm 12s cubic-bezier(.23,1,.32,1) infinite; }
    .spark { animation: drift 8s cubic-bezier(.77,0,.175,1) infinite; }
    .spark-b { animation-delay: -3s; }
    .spark-c { animation-delay: -6s; }
    @keyframes enter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ripple { 0% { opacity: .5; transform: scale(.95); } 85%, 100% { opacity: 0; transform: scale(2.5); } }
    @keyframes voice { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    @keyframes signal { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.55); } }
    @keyframes confirm { 0%, 62% { opacity: .5; transform: scale(.95); } 70%, 92% { opacity: 1; transform: scale(1.12); } 100% { opacity: .5; transform: scale(.95); } }
    @keyframes drift { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: .65; transform: translateY(-18px); } }
    @keyframes step {
      0%, 28% { opacity: 1; }
      32%, 96% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes flow {
      0%, 27% { transform: translateX(0); }
      34%, 60% { transform: translateX(160px); }
      67%, 92% { transform: translateX(320px); }
      100% { transform: translateX(0); }
    }
    @keyframes arrive { from { opacity: .7; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .step { animation: none; opacity: .65; }
      .flow, .enter, .halo, .wave, .signal, .check, .spark { animation: none; }
      .halo { opacity: 0; }
      .scene { animation: arrive 200ms ease-out both; }
    }
  </style>
  <g class="scene">
    <rect x="1" y="1" width="1198" height="478" rx="26" fill="url(#background)" stroke="#375d48" stroke-width="2"/>
    <rect x="2" y="2" width="1196" height="476" rx="25" fill="url(#grid)"/>
    <path d="M880 0C900 120 1090 30 1200 166M970 480C910 330 1120 340 1200 220" fill="none" stroke="#85ac81" stroke-opacity=".09" stroke-width="50"/>
    <g fill="#c9e2b5" opacity=".45" aria-hidden="true">
      <circle class="spark" cx="490" cy="91" r="3"/>
      <circle class="spark spark-b" cx="568" cy="188" r="2"/>
      <circle class="spark spark-c" cx="545" cy="310" r="3"/>
      <circle class="spark spark-b" cx="473" cy="434" r="2"/>
    </g>

    <g transform="translate(50 46)">
      <g class="enter">
      <rect width="36" height="36" rx="12" fill="#c9e2b5"/>
      <g fill="none" stroke="#193d30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 27V15M18 22C9 22 9 11 9 11s9 0 9 11ZM18 18c0-9 9-10 9-10s1 10-9 10Z"/>
      </g>
      <text x="50" y="23" class="small" fill="#c9ddc7">TEN-MINUTE MENTOR</text>
      </g>
    </g>

    <text class="enter delay-one" x="48" y="170" fill="#f2f5e9" font-size="76" font-weight="750" letter-spacing="-3">Dev<tspan fill="#c9e2b5">Buds</tspan><tspan fill="#c9e2b5">.</tspan></text>
    <text class="enter delay-two" x="52" y="222" fill="#f2f5e9" font-size="27" font-weight="600" letter-spacing="-.5">Better conversations.</text>
    <text class="enter delay-three" x="52" y="258" fill="#f2f5e9" font-size="27" font-weight="600" letter-spacing="-.5">Stronger student support.</text>
    <text class="enter delay-four" x="52" y="298" fill="#b4cbb6" font-size="15">Spot concerns. Make time. Keep commitments.</text>

    <g transform="translate(52 344)">
      <path d="M12 14H332" fill="none" stroke="#52745b" stroke-width="2"/>
      <g fill="#193d30" stroke="#86aa7d" stroke-width="2"><circle cx="12" cy="14" r="6"/><circle cx="172" cy="14" r="6"/><circle cx="332" cy="14" r="6"/></g>
      <g class="flow">
        <circle class="halo" cx="12" cy="14" r="8" fill="none" stroke="#c9e2b5" stroke-width="1.5"/>
        <circle cx="-5" cy="14" r="2" fill="#c9e2b5" opacity=".25"/>
        <circle cx="3" cy="14" r="3" fill="#c9e2b5" opacity=".5"/>
        <circle cx="12" cy="14" r="6" fill="#c9e2b5"/>
      </g>
      <g fill="#d1e0c9" font-size="13" font-weight="600"><text y="48">01 / Notice</text><text x="160" y="48">02 / Talk</text><text x="320" y="48">03 / Follow through</text></g>
    </g>

    <g transform="translate(644 44)">
      <rect width="508" height="392" rx="21" fill="#112e25" stroke="#4b6b4f"/>
      <circle cx="25" cy="26" r="3" fill="#719b72"/><circle cx="38" cy="26" r="3" fill="#719b72"/><circle cx="51" cy="26" r="3" fill="#719b72"/>
      <text x="484" y="30" fill="#b4cbb6" text-anchor="end" font-size="10" font-weight="600" letter-spacing="1.6">THE MENTORING LOOP</text>
      <path d="M0 51H508" stroke="#35503d"/>

      <g transform="translate(20 70)">
        <g class="enter delay-two">
        <rect width="468" height="88" rx="13" fill="url(#card)"/>
        <rect class="step first" x=".75" y=".75" width="466.5" height="86.5" rx="12.25" fill="none" stroke="#c9e2b5" stroke-width="1.5"/>
        <rect x="15" y="20" width="46" height="46" rx="13" fill="#355d44"/>
        <g fill="none" stroke="#c9e2b5" stroke-width="2" stroke-linecap="round"><path class="signal" d="M28 51V43"/><path class="signal signal-b" d="M38 51V34"/><path class="signal signal-c" d="M48 51V28"/></g>
        <text x="78" y="35" fill="#eff5e7" font-size="17" font-weight="650">Notice the signals</text>
        <text x="78" y="60" fill="#b4cbb6" font-size="13">Attendance, marks &amp; LMS activity</text>
        <circle class="step first" cx="440" cy="44" r="4" fill="#c9e2b5"/>
        </g>
      </g>

      <g transform="translate(20 172)">
        <g class="enter delay-three">
        <rect width="468" height="88" rx="13" fill="url(#card)"/>
        <rect class="step second" x=".75" y=".75" width="466.5" height="86.5" rx="12.25" fill="none" stroke="#c9e2b5" stroke-width="1.5"/>
        <rect x="15" y="20" width="46" height="46" rx="13" fill="#355d44"/>
        <g fill="none" stroke="#c9e2b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="34" y="28" width="8" height="18" rx="4"/><path d="M28 40v2a10 10 0 0 0 20 0v-2M38 52v6M33 58h10"/></g>
        <text x="78" y="35" fill="#eff5e7" font-size="17" font-weight="650">Make time to talk</text>
        <text x="78" y="60" fill="#b4cbb6" font-size="13">Tamil / English voice notes &amp; editable drafts</text>
        <circle class="step second" cx="440" cy="44" r="4" fill="#c9e2b5"/>
        <g class="step second" fill="#c9e2b5" aria-hidden="true">
          <rect class="wave" x="389" y="27" width="3" height="16" rx="1.5"/>
          <rect class="wave wave-b" x="395" y="23" width="3" height="24" rx="1.5"/>
          <rect class="wave wave-c" x="401" y="19" width="3" height="32" rx="1.5"/>
          <rect class="wave wave-d" x="407" y="25" width="3" height="20" rx="1.5"/>
          <rect class="wave wave-b" x="413" y="28" width="3" height="14" rx="1.5"/>
        </g>
        </g>
      </g>

      <g transform="translate(20 274)">
        <g class="enter delay-four">
        <rect width="468" height="88" rx="13" fill="url(#card)"/>
        <rect class="step third" x=".75" y=".75" width="466.5" height="86.5" rx="12.25" fill="none" stroke="#c9e2b5" stroke-width="1.5"/>
        <rect x="15" y="20" width="46" height="46" rx="13" fill="#355d44"/>
        <g class="check" fill="none" stroke="#c9e2b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="38" cy="43" r="12"/><path d="m32 43 4 4 9-9"/></g>
        <text x="78" y="35" fill="#eff5e7" font-size="17" font-weight="650">Keep progress moving</text>
        <text x="78" y="60" fill="#b4cbb6" font-size="13">Reminders, timelines &amp; meeting preparation</text>
        <circle class="step third" cx="440" cy="44" r="4" fill="#c9e2b5"/>
        </g>
      </g>
    </g>
  </g>
</svg>
