<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">DevBuds — Ten-Minute Mentor</title>
  <desc id="description">A faculty mentoring workspace. Notice attendance, marks, and LMS signals. Talk using Tamil or English voice notes. Follow through with reminders, progress timelines, and meeting preparation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102c25"/>
      <stop offset="1" stop-color="#193d30"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#234c3d"/>
      <stop offset="1" stop-color="#1b3f32"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#bad7b9" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .small { font-size: 12px; font-weight: 600; letter-spacing: 2px; }
    .step { animation: step 12s linear infinite; opacity: 0; }
    .first { opacity: 1; }
    .second { animation-delay: -8s; }
    .third { animation-delay: -4s; }
    .flow { animation: flow 12s cubic-bezier(.77,0,.175,1) infinite; }
    @keyframes step {
      0%, 28% { opacity: 1; }
      32%, 96% { opacity: 0; }
      100% { opacity: 1; }
    }
    @keyframes flow {
      0%, 27% { transform: translateX(0); }
      34%, 60% { transform: translateX(160px); }
      67%, 92% { transform: translateX(320px); }
      100% { transform: translateX(0); }
    }
    @keyframes arrive { from { opacity: .7; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .step { animation: none; opacity: .65; }
      .flow { animation: none; }
      .scene { animation: arrive 200ms ease-out both; }
    }
  </style>
  <g class="scene">
    <rect x="1" y="1" width="1198" height="478" rx="26" fill="url(#background)" stroke="#375d48" stroke-width="2"/>
    <rect x="2" y="2" width="1196" height="476" rx="25" fill="url(#grid)"/>
    <path d="M880 0C900 120 1090 30 1200 166M970 480C910 330 1120 340 1200 220" fill="none" stroke="#85ac81" stroke-opacity=".09" stroke-width="50"/>

    <g transform="translate(50 46)">
      <rect width="36" height="36" rx="12" fill="#c9e2b5"/>
      <g fill="none" stroke="#193d30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 27V15M18 22C9 22 9 11 9 11s9 0 9 11ZM18 18c0-9 9-10 9-10s1 10-9 10Z"/>
      </g>
      <text x="50" y="23" class="small" fill="#c9ddc7">TEN-MINUTE MENTOR</text>
    </g>

    <text x="48" y="170" fill="#f2f5e9" font-size="76" font-weight="750" letter-spacing="-3">Dev<tspan fill="#c9e2b5">Buds</tspan><tspan fill="#c9e2b5">.</tspan></text>
    <text x="52" y="222" fill="#f2f5e9" font-size="27" font-weight="600" letter-spacing="-.5">Better conversations.</text>
    <text x="52" y="258" fill="#f2f5e9" font-size="27" font-weight="600" letter-spacing="-.5">Stronger student support.</text>
    <text x="52" y="298" fill="#b4cbb6" font-size="15">Spot concerns. Make time. Keep commitments.</text>

    <g transform="translate(52 344)">
      <path d="M12 14H332" fill="none" stroke="#52745b" stroke-width="2"/>
      <g fill="#193d30" stroke="#86aa7d" stroke-width="2"><circle cx="12" cy="14" r="6"/><circle cx="172" cy="14" r="6"/><circle cx="332" cy="14" r="6"/></g>
      <circle class="flow" cx="12" cy="14" r="6" fill="#c9e2b5"/>
      <g fill="#d1e0c9" font-size="13" font-weight="600"><text y="48">01 / Notice</text><text x="160" y="48">02 / Talk</text><text x="320" y="48">03 / Follow through</text></g>
    </g>

    <g transform="translate(644 44)">
      <rect width="508" height="392" rx="21" fill="#112e25" stroke="#4b6b4f"/>
      <circle cx="25" cy="26" r="3" fill="#719b72"/><circle cx="38" cy="26" r="3" fill="#719b72"/><circle cx="51" cy="26" r="3" fill="#719b72"/>
      <text x="484" y="30" fill="#b4cbb6" text-anchor="end" font-size="10" font-weight="600" letter-spacing="1.6">THE MENTORING LOOP</text>
      <path d="M0 51H508" stroke="#35503d"/>

      <g transform="translate(20 70)">
        <rect width="468" height="88" rx="13" fill="url(#card)"/>
        <rect class="step first" x=".75" y=".75" width="466.5" height="86.5" rx="12.25" fill="none" stroke="#c9e2b5" stroke-width="1.5"/>
        <rect x="15" y="20" width="46" height="46" rx="13" fill="#355d44"/>
        <g fill="none" stroke="#c9e2b5" stroke-width="2" stroke-linecap="round"><path d="M28 51V43M38 51V34M48 51V28"/></g>
        <text x="78" y="35" fill="#eff5e7" font-size="17" font-weight="650">Notice the signals</text>
        <text x="78" y="60" fill="#b4cbb6" font-size="13">Attendance, marks &amp; LMS activity</text>
        <circle class="step first" cx="440" cy="44" r="4" fill="#c9e2b5"/>
      </g>

      <g transform="translate(20 172)">
        <rect width="468" height="88" rx="13" fill="url(#card)"/>
        <rect class="step second" x=".75" y=".75" width="466.5" height="86.5" rx="12.25" fill="none" stroke="#c9e2b5" stroke-width="1.5"/>
        <rect x="15" y="20" width="46" height="46" rx="13" fill="#355d44"/>
        <g fill="none" stroke="#c9e2b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="34" y="28" width="8" height="18" rx="4"/><path d="M28 40v2a10 10 0 0 0 20 0v-2M38 52v6M33 58h10"/></g>
        <text x="78" y="35" fill="#eff5e7" font-size="17" font-weight="650">Make time to talk</text>
        <text x="78" y="60" fill="#b4cbb6" font-size="13">Tamil / English voice notes &amp; editable drafts</text>
        <circle class="step second" cx="440" cy="44" r="4" fill="#c9e2b5"/>
      </g>

      <g transform="translate(20 274)">
        <rect width="468" height="88" rx="13" fill="url(#card)"/>
        <rect class="step third" x=".75" y=".75" width="466.5" height="86.5" rx="12.25" fill="none" stroke="#c9e2b5" stroke-width="1.5"/>
        <rect x="15" y="20" width="46" height="46" rx="13" fill="#355d44"/>
        <g fill="none" stroke="#c9e2b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="38" cy="43" r="12"/><path d="m32 43 4 4 9-9"/></g>
        <text x="78" y="35" fill="#eff5e7" font-size="17" font-weight="650">Keep progress moving</text>
        <text x="78" y="60" fill="#b4cbb6" font-size="13">Reminders, timelines &amp; meeting preparation</text>
        <circle class="step third" cx="440" cy="44" r="4" fill="#c9e2b5"/>
      </g>
    </g>
  </g>
</svg>
